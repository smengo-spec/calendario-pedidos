<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F3B63; --ink:#1C2733; --muted:#66738A; --line:#E1E6EE; --stage:#E8ECF2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Manrope,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--stage);
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Barra superior (solo en pantalla) ---------- */
.toolbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.toolbar input{width:min(320px,70vw);padding:9px 12px;border:1px solid #C9D1DD;border-radius:8px;font:inherit;font-size:15px}
.toolbar .grow{flex:1}
.estado{font-size:13px;color:var(--muted)}
.btn{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid #C9D1DD;background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:focus-visible,.toolbar input:focus-visible{outline:3px solid #7AA7E0;outline-offset:2px}
.notice{max-width:210mm;margin:12px auto 0;padding:10px 14px;background:#FFF4D6;border:1px solid #EAD08A;border-radius:8px;font-size:14px}
.review{max-width:210mm;margin:12px auto 0;padding:12px 16px;background:#EAF3FF;border:1px solid #B9D2F2;border-radius:8px;font-size:14px;line-height:1.45}
.review ul{margin:.4em 0 0;padding-left:1.2em}
.review[hidden],.notice[hidden]{display:none}

/* ---------- Hoja A4 ---------- */
.stage{display:flex;justify-content:center;padding:18px 12px 48px}
.page{--s:1;width:210mm;min-height:297mm;padding:8mm;background:#fff;box-shadow:0 4px 20px rgba(24,40,66,.14)}
.sheet{font-size:calc(10.5px * var(--s))}
.cargando,.vacio{padding:3em 1em;text-align:center;color:var(--muted);font-size:1.3em}

.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:1.5em;
  padding:1em 1.2em;background:var(--navy);color:#fff;border-radius:.45em .45em 0 0}
.hd h1{margin:0;font-size:2.1em;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.hd .sub{margin:.35em 0 0;font-size:1.05em;font-weight:500;opacity:.9}
.leyenda{display:grid;gap:.25em;font-size:.95em;font-weight:500;text-align:right}

.tablewrap{margin-top:.6em}
.tabla{width:100%;border-collapse:collapse;table-layout:fixed}
.tabla th,.tabla td{padding:.34em .45em;border-bottom:1px solid var(--line);vertical-align:middle}
.tabla thead th{background:#EEF2F8;color:var(--navy);font-weight:700;text-align:center;line-height:1.15;border-bottom:.18em solid var(--navy)}
.tabla thead th.nombre{text-align:left}
.tabla thead th.actual{background:var(--navy);color:#fff}
.tabla thead th small{display:block;margin-top:.15em;font-size:.8em;font-weight:600;opacity:.9}
.col-nombre{width:30mm}
tr.banda td{background:var(--acc);color:#fff;font-weight:700;font-size:.95em;padding:.3em .6em;border-bottom:0}
tr.banda .bt{display:inline-block}
tr.banda .det{margin-left:.6em;font-weight:500;opacity:.92}
tr.franq td.nombre{background:var(--tint);border-left:.32em solid var(--acc);font-weight:700}
tr.franq td.c{text-align:center;font-weight:600;font-size:calc(.96em * var(--k, 1));padding-left:.2em;padding-right:.2em;font-variant-numeric:tabular-nums}
tr.franq td.actual{background:#F1F5FB}
tr.franq td.no{color:#B4BDCA;font-weight:400}
.tabla .pasada{opacity:.5}
tr.oculta{display:none}
tr,td,th{break-inside:avoid}

.pie{display:grid;grid-template-columns:1fr auto;gap:1em;align-items:end;margin-top:.9em}
.avisos{display:grid;gap:.4em}
.aviso{padding:.55em .8em;border-left:.3em solid #C96A12;background:#FFF4E8;border-radius:.3em;font-weight:600}
.limite{font-weight:700;color:var(--navy)}
.meta{font-size:.85em;color:var(--muted);text-align:right}

/* ---------- Celular: la tabla se desliza y la primera columna queda fija ---------- */
@media screen and (max-width:860px){
  body:not(.a4) .stage{display:block;padding:0}
  body:not(.a4) .page{width:100%;min-height:0;padding:0;box-shadow:none}
  body:not(.a4) .sheet{font-size:13.5px}
  body:not(.a4) .hd{border-radius:0;flex-direction:column;align-items:flex-start;gap:.8em}
  body:not(.a4) .leyenda{text-align:left}
  body:not(.a4) .tablewrap{overflow-x:auto}
  body:not(.a4) .tabla{min-width:calc(140px + var(--n) * 122px)}
  body:not(.a4) .col-nombre{width:140px}
  body:not(.a4) .tabla .nombre{position:sticky;left:0;z-index:2}
  body:not(.a4) .tabla thead th.nombre{background:#EEF2F8}
  body:not(.a4) .tabla td.c{white-space:nowrap;font-size:1em}
  body:not(.a4) .toolbar{position:static}
  body:not(.a4) .estado{display:none}
  body:not(.a4) .toolbar .btn{flex:1 1 0}
  body:not(.a4) .toolbar .grow{display:none}
  body:not(.a4) tr.banda .bt{position:sticky;left:12px}
  body:not(.a4) .toolbar input{width:100%}
  body:not(.a4) .pie{grid-template-columns:1fr;padding:0 .9em .9em}
  body:not(.a4) .meta{text-align:left}
  body:not(.a4) .notice,body:not(.a4) .review{margin:10px}
}

/* ---------- Impresión / PDF ---------- */
.a4 tr.oculta{display:table-row}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff}
  .no-print{display:none !important}
  .stage{display:block;padding:0}
  .page{width:210mm;min-height:0;box-shadow:none;margin:0}
  tr.oculta{display:table-row}
}
</style>
</head>
<body>

<div class="toolbar no-print">
  <label class="sr" for="buscar">Buscar franquicia</label>
  <input id="buscar" type="search" placeholder="Buscá tu franquicia" autocomplete="off">
  <span class="grow"></span>
  <span id="estado" class="estado" aria-live="polite"></span>
  <button id="btnActualizar" class="btn" type="button">Actualizar</button>
  <button id="btnImprimir" class="btn primary" type="button">Imprimir / PDF</button>
</div>
<div id="avisoConexion" class="notice no-print" hidden></div>
<div id="revision" class="review no-print" hidden></div>

<main class="stage">
  <article class="page" id="page">
    <div class="sheet" id="sheet"><p class="cargando">Cargando calendario…</p></div>
  </article>
</main>

<noscript><p style="padding:2em;text-align:center">Para ver el calendario necesitás tener JavaScript activado en el navegador.</p></noscript>

<script src="datos.js"></script>
<script>
(function(){
'use strict';
const D = CalendarioDatos;
const {norm, esc, cap, DAY, DIA_ABREV, MESES, rangoSemana, esActual, esPasada, fmtFechaHora} = D;

/* =====================================================================
   CONFIGURACIÓN de esta página (la conexión con la hoja está en datos.js)
   ===================================================================== */
const CONFIG = {
  titulo: "Calendario de pedidos",

  // Qué significan las fechas: "pedido", "despacho" o "entrega"
  queIndicanLasFechas: "pedido",

  // Si querés, un horario fijo (también se puede poner desde la hoja, ver más abajo)
  horarioLimite: "",

  // true = no muestra las semanas que ya pasaron
  ocultarSemanasPasadas: false
};

/* AVISOS Y HORARIO DESDE LA HOJA (sin tocar el código):
   escribí en cualquier celda libre, por ejemplo la A1:
     AVISO: Lunes 12/10 feriado, los pedidos se adelantan al viernes 9/10
     HORARIO: Pedidos hasta las 12:00 hs
   Se pueden poner varios avisos, uno por celda. */

const PALETA = [
  {tint:'#E3EEFA', acc:'#2F6DB5'},
  {tint:'#E1F2E5', acc:'#2E8B57'},
  {tint:'#ECE5F7', acc:'#7B5EA7'},
  {tint:'#FDE9D4', acc:'#C96A12'},
  {tint:'#FFF3C9', acc:'#8A6D00'},
  {tint:'#DAF1EF', acc:'#1E8C88'},
  {tint:'#FBE0E4', acc:'#C2415D'},
  {tint:'#EDEFF2', acc:'#5B6472'}
];
const ADMIN = /(^|[?&#])admin(=|&|$)/.test(location.search + location.hash);
const $ = id => document.getElementById(id);

function textoCelda(sem, dias){
  const mesInicio = new Date(sem.inicio).getUTCMonth();
  return dias.map(d => {
    const f = new Date(sem.inicio + (d - 1) * DAY);
    const sufijo = f.getUTCMonth() !== mesInicio ? '/' + (f.getUTCMonth() + 1) : '';
    return DIA_ABREV[d] + '\u00A0' + f.getUTCDate() + sufijo;
  }).join(' · ');
}

function tituloMes(sems){
  const a = new Date(sems[0].inicio + 2 * DAY), b = new Date(sems[sems.length - 1].inicio + 2 * DAY);
  const ma = cap(MESES[a.getUTCMonth()]), mb = cap(MESES[b.getUTCMonth()]);
  if (a.getUTCFullYear() === b.getUTCFullYear())
    return ma === mb ? ma + ' ' + a.getUTCFullYear() : ma + ' – ' + mb + ' ' + a.getUTCFullYear();
  return ma + ' ' + a.getUTCFullYear() + ' – ' + mb + ' ' + b.getUTCFullYear();
}

/* ---------------- Dibujo ---------------- */
const LEYENDA_FECHAS = {pedido: ['📝', 'Día de pedido'], despacho: ['📦', 'Día de despacho'], entrega: ['📦', 'Día de entrega']};

function render(hoja, modelo, meta){
  const semanas = modelo.semanas;
  let vis = [];
  semanas.forEach((s, i) => { if (!CONFIG.ocultarSemanasPasadas || !esPasada(s)) vis.push(i); });
  if (!vis.length) vis = semanas.map((s, i) => i);
  const visSem = vis.map(i => semanas[i]);
  const nCols = vis.length;
  const leyenda = LEYENDA_FECHAS[CONFIG.queIndicanLasFechas] || LEYENDA_FECHAS.pedido;
  const modulo = (semanas.find(s => s.modulo) || {}).modulo || '';
  const horario = hoja.horario || CONFIG.horarioLimite;

  let h = '';
  h += '<header class="hd"><div><h1>' + esc(CONFIG.titulo) + '</h1><p class="sub">' + esc(tituloMes(visSem)) +
       (modulo ? ' · Módulo ' + esc(modulo) : '') + '</p></div>' +
       '<div class="leyenda"><span>' + leyenda[0] + ' ' + esc(leyenda[1]) + '</span><span>— No corresponde esa semana</span></div></header>';

  h += '<div class="tablewrap"><table class="tabla" style="--n:' + nCols + ';--k:' + (nCols <= 5 ? 1 : Math.max(0.7, 5.5 / nCols)).toFixed(3) + '"><colgroup><col class="col-nombre">' +
       vis.map(() => '<col>').join('') + '</colgroup><thead><tr><th class="nombre">Franquicia</th>';
  vis.forEach(i => {
    const s = semanas[i], act = esActual(s);
    h += '<th class="' + (act ? 'actual ' : '') + (esPasada(s) ? 'pasada' : '') + '">' + rangoSemana(s) + (act ? '<small>Esta semana</small>' : '') + '</th>';
  });
  h += '</tr></thead><tbody>';

  modelo.grupos.forEach((g, gi) => {
    const filas = g.franqs.filter(f => vis.some(i => f.sem[i]));
    if (!filas.length) return;
    h += '<tr class="banda" data-g="' + gi + '" style="--acc:' + g.color.acc + '"><td colspan="' + (nCols + 1) + '"><span class="bt">' + esc(g.titulo) +
         (g.detalle ? ' <span class="det">' + esc(g.detalle) + '</span>' : '') + '</span></td></tr>';
    filas.forEach(f => {
      h += '<tr class="franq" data-g="' + gi + '" data-k="' + esc(f.clave) + '" style="--acc:' + g.color.acc + ';--tint:' + g.color.tint + '">' +
           '<td class="nombre">' + esc(f.nombre) + '</td>';
      vis.forEach(i => {
        const s = semanas[i];
        const cls = (esActual(s) ? ' actual' : '') + (esPasada(s) ? ' pasada' : '');
        h += f.sem[i] ? '<td class="c' + cls + '">' + textoCelda(s, f.sem[i]) + '</td>' : '<td class="c no' + cls + '">—</td>';
      });
      h += '</tr>';
    });
  });
  h += '</tbody></table></div>';

  h += '<footer class="pie"><div class="avisos">' +
       (horario ? '<div class="limite">⏰ ' + esc(horario) + '</div>' : '') +
       hoja.avisos.map(a => '<div class="aviso">⚠️ ' + esc(a) + '</div>').join('') +
       '</div><div class="meta">' + esc(meta) + '</div></footer>';

  $('sheet').innerHTML = h;
  document.title = CONFIG.titulo + ' · ' + tituloMes(visSem);
}

function aplicarFiltro(){
  const q = norm($('buscar').value);
  const conFilas = {};
  document.querySelectorAll('#sheet tr.franq').forEach(tr => {
    const ok = !q || tr.getAttribute('data-k').indexOf(q) >= 0;
    tr.classList.toggle('oculta', !ok);
    if (ok) conFilas[tr.getAttribute('data-g')] = true;
  });
  document.querySelectorAll('#sheet tr.banda').forEach(tr => {
    tr.classList.toggle('oculta', !!q && !conFilas[tr.getAttribute('data-g')]);
  });
}

/* En celular, deja a la vista la semana actual (solo la primera vez) */
let yaScrolleo = false;
function irASemanaActual(){
  if (yaScrolleo) return;
  const wrap = document.querySelector('.tablewrap'), th = document.querySelector('.tabla thead th.actual');
  if (!wrap || !th) return;
  yaScrolleo = true;
  if (wrap.scrollWidth > wrap.clientWidth) wrap.scrollLeft = Math.max(0, th.offsetLeft - 140);
}

/* Achica la tipografía justo lo necesario para que todo entre en una hoja A4 */
function ajustar(){
  const b = document.body, yaA4 = b.classList.contains('a4');
  b.classList.add('a4');
  const page = $('page'), sheet = $('sheet');
  const limite = (297 - 16 - 4) * 96 / 25.4;
  let lo = 0.45, hi = 1.4;
  for (let i = 0; i < 14; i++){
    const mid = (lo + hi) / 2;
    page.style.setProperty('--s', mid);
    if (sheet.getBoundingClientRect().height <= limite) lo = mid; else hi = mid;
  }
  page.style.setProperty('--s', lo);
  if (!yaA4) b.classList.remove('a4');
}

/* ---------------- Carga y actualización ---------------- */
let ultimo = {texto: null, fuente: null};
let ultimaCarga = 0;

function panelRevision(hoja, modelo, res){
  const el = $('revision');
  if (!ADMIN){ el.hidden = true; return; }
  let h = '<strong>Revisión (solo la ves vos con ?admin)</strong><ul>';
  h += '<li>Conexión: ' + (res.fuente === 'hoja' ? 'leyendo la hoja en vivo.' :
       'no se pudo leer la hoja. ' + esc(res.error ? res.error.message : 'Sin datos') + '. Se muestra una copia.') + '</li>';
  h += '<li>Semanas leídas: ' + modelo.semanas.length + ' (' + modelo.semanas.map(rangoSemana).join(', ') + '). Franquicias: ' + modelo.total + '.</li>';
  h += modelo.correcciones.length
    ? '<li>Nombres corregidos solos: ' + modelo.correcciones.map(c => esc(c.de) + ' → ' + esc(c.a)).join(', ') + '.</li>'
    : '<li>Ningún nombre necesitó corrección.</li>';
  h += modelo.anomalias.length
    ? modelo.anomalias.map(a => '<li>⚠️ ' + esc(a) + ' ¿Falta cargarla en la hoja?</li>').join('')
    : '<li>No detecté franquicias faltantes en alguna semana.</li>';
  h += '<li>Avisos en la hoja: ' + (hoja.avisos.length || 'ninguno') + (hoja.horario ? '. Horario: ' + esc(hoja.horario) : '') + '.</li></ul>';
  el.innerHTML = h; el.hidden = false;
}

function procesar(res){
  const leido = D.leer(res.texto), hoja = leido.hoja, modelo = leido.modelo;
  const aviso = $('avisoConexion');
  if (!modelo){
    $('sheet').innerHTML = '<p class="vacio">No encontré semanas en la hoja. Revisá que cada bloque tenga una fila con «SEMANA», la fecha de inicio y la fecha de fin.</p>';
    return;
  }
  modelo.grupos.forEach((g, i) => { g.color = PALETA[i % PALETA.length]; });
  const meta = res.fuente === 'hoja'
    ? 'Actualizado el ' + fmtFechaHora(new Date(res.ts))
    : 'Última copia guardada' + (res.ts ? ' del ' + fmtFechaHora(new Date(res.ts)) : '');
  render(hoja, modelo, meta);

  if (res.fuente === 'hoja') aviso.hidden = true;
  else {
    aviso.textContent = (res.fuente === 'guardada'
      ? 'No se pudo actualizar desde la hoja. Se muestra la última versión guardada en este equipo.'
      : 'No se pudo conectar con la hoja. Se muestra una copia incluida en la página que puede estar desactualizada.')
      + (res.error ? ' (Detalle: ' + res.error.message + ')' : '');
    aviso.hidden = false;
  }
  panelRevision(hoja, modelo, res);
  aplicarFiltro();
  ajustar();
  irASemanaActual();
}

async function cargar(manual){
  const est = $('estado');
  est.textContent = 'Actualizando…';
  const res = await D.cargar();
  ultimaCarga = Date.now();
  if (manual || res.texto !== ultimo.texto || res.fuente !== ultimo.fuente){
    ultimo = {texto: res.texto, fuente: res.fuente};
    procesar(res);
  }
  est.textContent = res.fuente === 'hoja' ? 'Al día · ' + fmtFechaHora(new Date()) : 'Sin conexión con la hoja';
}

/* ---------------- Eventos ---------------- */
$('buscar').addEventListener('input', aplicarFiltro);
$('btnActualizar').addEventListener('click', () => cargar(true));
$('btnImprimir').addEventListener('click', () => window.print());
window.addEventListener('beforeprint', () => { document.body.classList.add('a4'); ajustar(); });
window.addEventListener('afterprint', () => { document.body.classList.remove('a4'); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - ultimaCarga > 60000) cargar(false);
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if ($('sheet').querySelector('.tabla')) ajustar(); });

cargar(true);
setInterval(() => cargar(false), Math.max(1, D.CONFIG.refrescarCadaMinutos) * 60000);
})();
</script>
</body>
</html>
